<div class="scroll-progress" [style.width.%]="progress" aria-hidden="true"></div>

<header
  [ngClass]="{
    scrolled: scrolled,
    transparent: isHome && !scrolled && !menuOpen && !behandlungenOpen
  }"
  class="nav-bar"
>
  <a [routerLink]="p('/')" class="nav-logo" (click)="setActiveTab('home')"
    >FareWell<span class="logo-dot">.</span></a
  >

  <!-- Burger Icon. aria-controls nennt zwei Ziele: unter 769px klappt der
       Burger .nav-links-container auf, zwischen 769px und 1260px dagegen
       .nav-secondary. -->
  <button
    type="button"
    class="burger"
    [ngClass]="{ open: menuOpen }"
    (click)="toggleMenu()"
    [attr.aria-label]="
      menuOpen ? lang.t('Menü schließen', 'Close menu') : lang.t('Menü öffnen', 'Open menu')
    "
    [attr.aria-expanded]="menuOpen"
    aria-controls="nav-primary nav-secondary"
  >
    <span></span>
    <span></span>
    <span></span>
  </button>

  <!-- Nav links -->
  <nav
    class="nav-links-container"
    [ngClass]="{ open: menuOpen }"
    id="nav-primary"
    [attr.aria-label]="lang.t('Hauptnavigation', 'Main navigation')"
  >
    <a
      href="https://salonkee.de/salon/farewell?lang=de"
      target="_blank"
      rel="noopener noreferrer"
      class="nav-link"
      id="terminBuchen"
      [attr.aria-label]="
        lang.t(
          'Termin Buchen: Online-Buchung bei Salonkee, öffnet in einem neuen Tab',
          'Book now: online booking at Salonkee, opens in a new tab'
        )
      "
      (click)="trackBookingClick($event)"
    >
      <span class="lang de">Termin Buchen</span><span class="lang en">Book now</span>
    </a>

    <!-- Behandlungen -->
    <div class="nav-item behandlungen">
      <!-- Desktop: tight hover trigger -->
      <div
        class="behandlungen-trigger"
        (pointerenter)="onBehandlungenEnter($event)"
        (pointerleave)="onBehandlungenLeave($event)"
      >
        <button
          type="button"
          class="nav-link nav-link-btn"
          [class.active]="isBehandlungenRoute"
          [attr.aria-expanded]="behandlungenOpen"
          aria-controls="nav-behandlungen-mobile nav-behandlungen-panel"
          aria-haspopup="true"
          (click)="toggleBehandlungen($event)"
        >
          <span class="lang de">Behandlungen</span><span class="lang en">Treatments</span>
          <span class="chevron" [ngClass]="{ open: behandlungenOpen }" aria-hidden="true">▾</span>
        </button>
      </div>

      <div
        id="nav-behandlungen-mobile"
        class="behandlungen-mobile"
        [ngClass]="{ open: behandlungenOpen }"
      >
        <div class="behandlungen-mobile-inner">
          <a
            class="behandlungen-mobile-link"
            *ngFor="let t of treatments; trackBy: trackTreatment"
            [routerLink]="t.route"
            (click)="setActiveTab('behandlungen')"
          >
            {{ t.title }}
          </a>
        </div>
      </div>
    </div>

    <!-- Sekundäre Links: auf Tablets im Burger-Menü, sonst Teil der Leiste -->
    <div id="nav-secondary" class="nav-secondary">
      <a
        [routerLink]="p('/zeit')"
        routerLinkActive="active"
        (click)="setActiveTab('zeit')"
        class="nav-link"
      >
        <span class="lang de">Zeit-Rechner</span><span class="lang en">Time calculator</span>
      </a>

      <a
        [routerLink]="p('/historie')"
        routerLinkActive="active"
        (click)="setActiveTab('historie')"
        class="nav-link"
      >
        <span class="lang de">Historie</span><span class="lang en">History</span>
      </a>

      <a
        [routerLink]="p('/price')"
        routerLinkActive="active"
        (click)="setActiveTab('price')"
        class="nav-link"
      >
        <span class="lang de">Preis</span><span class="lang en">Prices</span>
      </a>

      <a
        [routerLink]="p('/faq')"
        routerLinkActive="active"
        (click)="setActiveTab('faq')"
        class="nav-link"
      >
        FAQ
      </a>

      <a
        [routerLink]="p('/karriere')"
        routerLinkActive="active"
        (click)="setActiveTab('karriere')"
        class="nav-link"
      >
        <span class="lang de">Karriere</span><span class="lang en">Careers</span>
      </a>

      <!-- Sprachumschalter: letztes Element, auf Desktop rechts, auf Mobil unten -->
      <div class="nav-lang">
        <app-guide-lang-toggle
          [lang]="lang.lang()"
          (langChange)="lang.setLang($event)"
        />
      </div>
    </div>
  </nav>

  <!-- Eigenes Navigations-Landmark: das Panel liegt als Geschwister ausserhalb
       von <nav id="nav-primary">, weil es position:fixed ist und dort
       zurechtgeschnitten wuerde. Ohne eigenen Namen faenden die sieben
       Behandlungsseiten in der Landmark-Navigation gar nicht statt. -->
  <div
    id="nav-behandlungen-panel"
    role="navigation"
    [attr.aria-label]="lang.t('Behandlungen', 'Treatments')"
    class="behandlungen-panel"
    [ngClass]="{ open: behandlungenOpen }"
    (pointerenter)="onBehandlungenEnter($event)"
    (pointerleave)="onBehandlungenLeave($event)"
  >
    <div class="panel-inner">
      <a
        class="treatment-card"
        *ngFor="let t of treatments; trackBy: trackTreatment"
        [routerLink]="t.route"
        (click)="setActiveTab('behandlungen')"
      >
        <div class="card-image" [style.backgroundImage]="'url(' + t.image + ')'">
          <div class="image-overlay"></div>
          <div class="card-title">{{ t.title }}</div>
        </div>
        <div class="card-desc">{{ t.description }}</div>
      </a>
    </div>
  </div>
</header>
