<!-- Skip-Link: erstes fokussierbares Element der Seite.
     Das href trägt bewusst den vollen Pfad der aktuellen Seite: wegen
     <base href="/"> würde ein blosses "#main-content" gegen "/" aufgelöst und
     ein Klick vor dem Start von Angular (oder ganz ohne JavaScript) landete
     auf der Startseite. Mit vollem Pfad springt der Browser auch ohne JS
     korrekt; skipToContent() übernimmt danach den Fokus. -->
<a class="skip-link no-underline" [href]="skipHref" (click)="skipToContent($event)">{{
  t('Zum Inhalt springen', 'Skip to content')
}}</a>

<app-header></app-header>

<main id="main-content" tabindex="-1">
  <router-outlet></router-outlet>
</main>

<app-footer></app-footer>

<app-cookie-banner></app-cookie-banner>
